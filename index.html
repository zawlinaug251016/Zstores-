<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zstores - Hospital Order Dispatch</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@media print {
.no-print { display: none !important; }
.print-only { display: block !important; }
body { background: white; color: black; font-size: 11pt; }
.card { border: 1px solid #ccc !important; box-shadow: none !important; margin-bottom: 0.75rem; page-break-inside: avoid; }
}
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

if (typeof pdfjsLib !== 'undefined') {
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const DEFAULT_RULES = {
"ZAW REHAB RUN": [
"Full Cream Milk PC", "Hilo Milk PC", "Full Cream Milk - Brownes",
"Cheese - Cheddar PC", "Rice Pudding", "Custard PC",
"Vanilla Yogurt PC", "Vanilla Yoghurt PC", "Strawberry Yogurt PC", "Strawberry Yoghurt PC",
"Apple Juice PC", "Orange Juice PC", "Fresh Apple", "Apple Fresh", "Ice Coffee", "Iced Coffee",
"Chocolate Chill", "Ham & Salad Sandwich", "Egg Mayo Sandwich"
],
"STEVE.M REHAB RUN": [],
"JUICE RUN": [
"Apple Juice", "Orange Juice", "Diced Peaches", "Diced Pears"
],
"CHILLER RUN": [
"Full Cream Milk", "Hilo Milk", "Hilo PC Milk",
"Vanilla Yoghurt", "Strawberry Yoghurt", "Strawberry Yogurt",
"Rice Pudding", "Custard", "Cheese - Cheddar", "Cheddar PC",
"Sandwich", "Ham & Salad", "Egg Mayo"
],
"DRY RUN": [
"White Sugar", "Coffee PC", "Decaf Coffee", "Sweetener",
"Water Crackers", "Scotch Nice", "Soy Milk", "Rice Milk",
"Lactose Free Milk", "Tea Bags Black", "Green Tea", "Tea Bags - Bushells",
"Fruit Cake PC", "Milo"
],
"FREEZER RUN": [
"Ice Cream", "Butter PC", "Margarine PC"
],
"AFTERNOON RUN": [
"Bananas fresh", "Fresh Bananas", "Apple Fresh", "Fresh Apple", "Carrot Cake"
],
"PANTRY RUN": [
"Thick", "Thickened", "Level 100", "Level 400", "Level 900"
],
"MEDI HOTEL - CHILLER": [],
"MEDI HOTEL - DRY": []
};

const REHAB_WARDS = ["fshrehab2", "fshrehab1", "fshrehabground", "fshmentalhealtha", "rehab2", "rehab1", "rehabground", "mentalhealtha", "mentalhealth"];
const MEDI_HOTEL_WARDS = ["emergency", "m8", "m7", "m6", "m5"];

const REHAB_FREEZER_KEYWORDS = [
"butter pc", "margarine pc", "ice cream", "carrot cake",
"white bread", "wholemeal bread", "multigrain bread", "le moulin"
];

const AFTERNOON_KEYWORDS = [
"apple fresh", "fresh apple", "bananas fresh", "fresh bananas", "banana", "carrot cake"
];

const BREAD_KEYWORDS = [
"white bread", "wholemeal bread", "multigrain bread", "le moulin", "bread"
];

const JUICE_WARD_ORDER = [
"Mental Health", "Mental Health A", "Rehab 2", "Rehab Ground", "Rehab 1",
"FSH SSU", "SSU",
"FSH 3AB", "3AB", "FSH 4AB", "4AB", "FSH 5AB", "5AB", "FSH 6AB", "6AB", "FSH 7AB", "7AB",
"FSH 7CD", "7CD", "FSH 6CD", "6CD", "FSH 5CD", "5CD", "FSH 4CD", "4CD", "FSH 3CD", "3CD",
"FSH CCU", "CCU", "FSH ICU", "ICU",
"FSH - M8", "M8", "FSH - M7", "M7", "FSH - M6", "M6", "FSH - M5", "M5",
"FSH Emergency", "Emergency"
];

const CHILLER_WARD_ORDER = [
"Mental Health", "Rehab Ground", "Rehab 2", "Rehab 1",
"FSH 7CD", "7CD", "FSH 6CD", "6CD", "FSH 5CD", "5CD", "FSH 4CD", "4CD", "FSH 3CD", "3CD",
"FSH CCU", "CCU", "FSH ICU", "ICU",
"FSH 7AB", "7AB", "FSH 6AB", "6AB", "FSH 5AB", "5AB", "FSH 4AB", "4AB", "FSH 3AB", "3AB",
"FSH SSU", "SSU",
"FSH - M8", "M8", "FSH - M7", "M7", "FSH - M6", "M6", "FSH - M5", "M5",
"FSH Emergency", "Emergency"
];

const ZAW_REHAB_WARD_ORDER = ["Rehab Ground", "FSH-Rehab Ground", "Rehab 2", "FSH-Rehab 2", "Rehab 1", "FSH-Rehab 1", "Mental Health A", "FSH-Mental Health A"];
const STEVE_REHAB_WARD_ORDER = ["Rehab 2", "FSH-Rehab 2", "Rehab Ground", "FSH-Rehab Ground", "Rehab 1", "FSH-Rehab 1", "Mental Health A", "FSH-Mental Health A"];

const STANDARD_RUN_WARD_ORDER = [
"FSH 7CD", "7CD", "FSH 6CD", "6CD", "FSH 5CD", "5CD", "FSH 4CD", "4CD", "FSH 3CD", "3CD",
"FSH CCU", "CCU", "FSH ICU", "ICU",
"FSH 7AB", "7AB", "FSH 6AB", "6AB", "FSH 5AB", "5AB", "FSH 4AB", "4AB", "FSH 3AB", "3AB",
"FSH SSU", "SSU"
];

const formatDateDDMMYY = (dateStr) => {
if (!dateStr) return "";
const parts = dateStr.match(/(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})/);
if (parts) {
let day, month, year;
if (parts[1].length === 4) {
year = parts[1].slice(-2);
month = parts[2].padStart(2, '0');
day = parts[3].padStart(2, '0');
} else {
day = parts[1].padStart(2, '0');
month = parts[2].padStart(2, '0');
year = parts[3].slice(-2);
}
return `${day}/${month}/${year}`;
}
return dateStr;
};

function App() {
const [rules, setRules] = useState(() => {
try {
const saved = localStorage.getItem('zstores_rules_v15');
return saved ? JSON.parse(saved) : DEFAULT_RULES;
} catch(e) {
return DEFAULT_RULES;
}
});

const [parsedData, setParsedData] = useState([]);
const [deliveryDate, setDeliveryDate] = useState("");
const [selectedRun, setSelectedRun] = useState("AFTERNOON RUN");
const [checkedItems, setCheckedItems] = useState({});
const [activeTab, setActiveTab] = useState("picker");
const [newCategoryItem, setNewCategoryItem] = useState("");
const [targetCategory, setTargetCategory] = useState("AFTERNOON RUN");
const [isLoading, setIsLoading] = useState(false);

useEffect(() => {
try {
localStorage.setItem('zstores_rules_v15', JSON.stringify(rules));
} catch(e) {}
}, [rules]);

const isChilledItem = (itemName) => {
const lower = itemName.toLowerCase();
const chillerKeywords = [...(rules["CHILLER RUN"] || []), "milk", "yoghurt", "yogurt", "custard", "pudding", "juice", "butter", "margarine", "cheese", "sandwich"];
return chillerKeywords.some(kw => lower.includes(kw.toLowerCase()));
};

const getCategory = (itemName, wardName) => {
const lowerItem = itemName.toLowerCase();
const cleanWard = wardName.toLowerCase().replace(/[^a-z0-9]/g, '');

// 1. Medi Hotel Wards
if (MEDI_HOTEL_WARDS.some(mw => cleanWard.includes(mw))) {
return isChilledItem(itemName) ? "MEDI HOTEL - CHILLER" : "MEDI HOTEL - DRY";
}

// 2. Rehab & Mental Health Wards
const isRehabWard = REHAB_WARDS.some(rw => cleanWard.includes(rw));
if (isRehabWard) {
const isFreezerItem = REHAB_FREEZER_KEYWORDS.some(kw => lowerItem.includes(kw));
if (isFreezerItem) {
return "FREEZER RUN";
}

const zawKeywords = rules["ZAW REHAB RUN"] || DEFAULT_RULES["ZAW REHAB RUN"];
const isZawItem = zawKeywords.some(kw => lowerItem.includes(kw.toLowerCase()));
return isZawItem ? "ZAW REHAB RUN" : "STEVE.M REHAB RUN";
}

// 3. General Wards - Explicit Route Rules & Exclusions

// STRICT BLOCK: Bread ordered by general wards is completely dropped (returns null)
const isBreadItem = BREAD_KEYWORDS.some(kw => lowerItem.includes(kw));
if (isBreadItem) {
return null;
}

// RULE: Sandwiches MUST go to CHILLER RUN (never PANTRY RUN)
if (lowerItem.includes("sandwich") || lowerItem.includes("ham & salad") || lowerItem.includes("egg mayo")) {
return "CHILLER RUN";
}

// RULE: Fresh Fruit & Carrot Cake MUST go to AFTERNOON RUN (never PANTRY RUN)
const isAfternoonItem = AFTERNOON_KEYWORDS.some(kw => lowerItem.includes(kw));
if (isAfternoonItem) {
return "AFTERNOON RUN";
}

// RULE: Thickened items to PANTRY RUN
if (lowerItem.includes("thick") || lowerItem.includes("level")) {
return "PANTRY RUN";
}

// 4. Custom User Rules Matching
for (const [category, keywords] of Object.entries(rules)) {
if (["ZAW REHAB RUN", "STEVE.M REHAB RUN", "MEDI HOTEL - CHILLER", "MEDI HOTEL - DRY"].includes(category)) continue;
if (keywords.some(kw => lowerItem.includes(kw.toLowerCase()))) {
return category;
}
}

// Default Fallback
return "PANTRY RUN";
};

const handleFileUpload = async (event) => {
const file = event.target.files[0];
if (!file) return;

setIsLoading(true);
try {
const arrayBuffer = await file.arrayBuffer();
const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
let fullTextLines = [];

for (let i = 1; i <= pdf.numPages; i++) {
const page = await pdf.getPage(i);
const textContent = await page.getTextContent();
const pageLines = textContent.items.map(item => item.str.trim()).filter(str => str !== "");
fullTextLines = [...fullTextLines, ...pageLines];
}

const { orders, extractedDate } = parseDeliveryNoteLines(fullTextLines);
setParsedData(orders);
setDeliveryDate(extractedDate);
setCheckedItems({});
} catch (err) {
alert("Error parsing PDF file: " + err.message);
} finally {
setIsLoading(false);
}
};

const parseDeliveryNoteLines = (lines) => {
const orders = [];
let currentWard = "Unknown Ward";
let extractedDate = "";

for (let i = 0; i < lines.length; i++) {
const line = lines[i];

if (line.toLowerCase().includes("for date:") || line.toLowerCase().includes("delivery note")) {
const dateMatch = line.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/);
if (dateMatch && !extractedDate) {
extractedDate = formatDateDDMMYY(dateMatch[0]);
}
}

if (line.includes("FSH-") || line.toLowerCase().includes("rehab") || line.toLowerCase().includes("mental health") || line.toLowerCase().includes("emergency")) {
if (!extractedDate) {
const dateMatch = line.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/);
if (dateMatch) extractedDate = formatDateDDMMYY(dateMatch[0]);
}

const match = line.match(/(FSH-[A-Za-z0-9\s\/]+?|Mental Health[A-Za-z0-9\s]*|Rehab\s+[A-Za-z0-9]+|Emergency)(?=\s+Ad|\s+\/|$)/i);
if (match) {
currentWard = match[1].trim();
} else {
currentWard = line.trim();
}
continue;
}

if (line.match(/^\d+$/) && i + 3 < lines.length) {
const possibleQty = lines[i + 1];
const possibleUnit = lines[i + 2];
const possibleName = lines[i + 3];

if (possibleQty.match(/^\d+$/) && (possibleUnit === "Each" || possibleUnit === "Litre" || possibleUnit === "Kilogram")) {
const assignedCategory = getCategory(possibleName, currentWard);

// Only add item if it wasn't blocked (category is not null)
if (assignedCategory !== null) {
orders.push({
id: `${currentWard}-${possibleName}-${Math.random()}`,
ward: currentWard,
qty: parseInt(possibleQty, 10),
unit: possibleUnit,
name: possibleName,
category: assignedCategory
});
}
i += 3;
}
}
}

return { orders, extractedDate };
};

const toggleCheck = (id) => {
setCheckedItems(prev => ({ ...prev, [id]: !prev[id] }));
};

const currentRunItems = useMemo(() => {
return parsedData.filter(item => item.category === selectedRun);
}, [parsedData, selectedRun]);

const itemSummary = useMemo(() => {
const totals = {};
currentRunItems.forEach(item => {
const key = `${item.name} (${item.unit})`;
totals[key] = (totals[key] || 0) + item.qty;
});
return totals;
}, [currentRunItems]);

const sortWardsByOrder = (grouped, orderArray) => {
const sortedGrouped = {};

orderArray.forEach(targetWard => {
const foundKey = Object.keys(grouped).find(
w => w.toLowerCase().replace(/[^a-z0-9]/g, '') === targetWard.toLowerCase().replace(/[^a-z0-9]/g, '')
);
if (foundKey && !sortedGrouped[foundKey]) {
sortedGrouped[foundKey] = grouped[foundKey];
}
});

Object.keys(grouped).forEach(wardKey => {
if (!sortedGrouped[wardKey]) {
sortedGrouped[wardKey] = grouped[wardKey];
}
});

return sortedGrouped;
};

const itemsByWard = useMemo(() => {
const grouped = {};
currentRunItems.forEach(item => {
if (!grouped[item.ward]) grouped[item.ward] = [];
grouped[item.ward].push(item);
});

if (selectedRun === "CHILLER RUN") {
return sortWardsByOrder(grouped, CHILLER_WARD_ORDER);
} else if (selectedRun === "JUICE RUN") {
return sortWardsByOrder(grouped, JUICE_WARD_ORDER);
} else if (selectedRun === "ZAW REHAB RUN") {
return sortWardsByOrder(grouped, ZAW_REHAB_WARD_ORDER);
} else if (selectedRun === "STEVE.M REHAB RUN") {
return sortWardsByOrder(grouped, STEVE_REHAB_WARD_ORDER);
} else if (["DRY RUN", "FREEZER RUN", "AFTERNOON RUN", "PANTRY RUN"].includes(selectedRun)) {
return sortWardsByOrder(grouped, STANDARD_RUN_WARD_ORDER);
}

return grouped;
}, [currentRunItems, selectedRun]);

const handleAddItemRule = (e) => {
e.preventDefault();
if (!newCategoryItem.trim()) return;

setRules(prev => ({
...prev,
[targetCategory]: [...(prev[targetCategory] || []), newCategoryItem.trim()]
}));
setNewCategoryItem("");
};

const handleRemoveRule = (category, keyword) => {
setRules(prev => ({
...prev,
[category]: prev[category].filter(k => k !== keyword)
}));
};

const availableCategories = [
"ZAW REHAB RUN", "STEVE.M REHAB RUN", "JUICE RUN",
"CHILLER RUN", "DRY RUN", "FREEZER RUN", "AFTERNOON RUN",
"PANTRY RUN", "MEDI HOTEL - CHILLER", "MEDI HOTEL - DRY"
];

return (
<div className="max-w-6xl mx-auto p-4 md:p-6">
<header className="no-print bg-slate-900 text-white p-4 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
<div>
<h1 className="text-2xl font-bold tracking-wide text-emerald-400">Zstores</h1>
<p className="text-slate-400 text-xs">Hospital Store Category Run Dispatch System</p>
</div>

<div className="flex items-center gap-3">
<button
onClick={() => setActiveTab("picker")}
className={`px-4 py-2 text-sm font-semibold rounded-lg transition ${activeTab === 'picker' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
>
RUN PICKER
</button>
<button
onClick={() => setActiveTab("settings")}
className={`px-4 py-2 text-sm font-semibold rounded-lg transition ${activeTab === 'settings' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
>
ITEM RULES SETTINGS
</button>
</div>
</header>

{activeTab === "picker" ? (
<div>
<div className="no-print bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
<div className="w-full md:w-auto">
<label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Upload Daily Delivery Note PDF</label>
<input
type="file"
accept="application/pdf"
onChange={handleFileUpload}
className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer"
/>
</div>

{parsedData.length > 0 && (
<button
onClick={() => window.print()}
className="w-full md:w-auto px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium rounded-lg flex items-center justify-center gap-2 shadow"
>
<span>PRINT ACTIVE RUN LIST</span>
</button>
)}
</div>

{isLoading && (
<div className="bg-white p-8 rounded-xl shadow-sm text-center font-medium text-slate-600">
Processing PDF Delivery Note...
</div>
)}

{parsedData.length > 0 && (
<div className="no-print grid grid-cols-2 md:grid-cols-5 gap-2 mb-6">
{availableCategories.map(category => {
const count = parsedData.filter(i => i.category === category).length;
const isSelected = selectedRun === category;
return (
<button
key={category}
onClick={() => setSelectedRun(category)}
className={`p-3 rounded-xl border text-left transition relative ${
isSelected
? 'bg-emerald-600 text-white border-emerald-600 shadow-md'
: 'bg-white text-slate-700 border-slate-200 hover:border-slate-300'
}`}
>
<div className="text-xs font-bold tracking-wider opacity-90">{category}</div>
<div className="text-xl font-bold mt-1">{count} <span className="text-xs font-normal">items</span></div>
</button>
);
})}
</div>
)}

{parsedData.length > 0 ? (
<div>
<div className="mb-4 flex justify-between items-end border-b pb-3">
<div>
<h2 className="text-xl font-bold text-slate-800">{selectedRun} DELIVERY LIST</h2>
<p className="text-xs text-slate-500">Sorted in fixed route print sequence</p>
</div>
<div className="flex items-center gap-2">
{deliveryDate && (
<span className="text-xs font-bold bg-emerald-100 text-emerald-900 border border-emerald-200 px-3 py-1 rounded-full">
Date: {deliveryDate}
</span>
)}
<span className="text-xs font-medium bg-slate-200 text-slate-700 px-3 py-1 rounded-full">
{currentRunItems.length} Total Items
</span>
</div>
</div>

{/* CATERING STORE PICKING SUMMARY */}
{Object.keys(itemSummary).length > 0 && (
<div className="card bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
<h3 className="text-sm font-bold text-emerald-900 uppercase tracking-wider mb-2 border-b border-emerald-200 pb-1">
📦 CATERING STORE PICK LIST SUMMARY
</h3>
<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
{Object.entries(itemSummary).map(([itemLabel, totalQty]) => (
<div key={itemLabel} className="flex justify-between items-center bg-white px-3 py-1.5 rounded border border-emerald-100 text-xs font-semibold text-slate-800">
<span>{itemLabel}</span>
<span className="bg-emerald-600 text-white px-2 py-0.5 rounded font-bold">{totalQty}</span>
</div>
))}
</div>
</div>
)}

{Object.keys(itemsByWard).length === 0 ? (
<div className="bg-white p-8 rounded-xl shadow-sm text-center text-slate-500">
No items requested for {selectedRun} in today's delivery note.
</div>
) : (
<div className="grid gap-4">
{Object.entries(itemsByWard).map(([ward, items]) => (
<div key={ward} className="card bg-white rounded-xl shadow-sm p-4 border border-slate-200">
<h3 className="text-lg font-bold text-slate-900 border-b pb-2 mb-3 flex justify-between items-center">
<span>{ward}</span>
<span className="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full">
{items.length} items
</span>
</h3>

<div className="divide-y divide-slate-100">
{items.map(item => {
const isChecked = !!checkedItems[item.id];
return (
<div
key={item.id}
onClick={() => toggleCheck(item.id)}
className={`py-2.5 px-2 flex items-center justify-between cursor-pointer rounded transition ${isChecked ? 'bg-slate-50 opacity-60' : 'hover:bg-slate-50'}`}
>
<div className="flex items-center gap-3">
<input
type="checkbox"
checked={isChecked}
onChange={() => {}}
className="w-5 h-5 accent-emerald-600 rounded cursor-pointer"
/>
<span className={`text-sm font-medium ${isChecked ? 'line-through text-slate-400' : 'text-slate-800'}`}>
{item.name}
</span>
</div>

<div className="text-sm font-bold text-slate-900 bg-slate-100 px-3 py-1 rounded-md">
{item.qty} <span className="text-xs font-normal text-slate-500">{item.unit}</span>
</div>
</div>
);
})}
</div>
</div>
))}
</div>
)}
</div>
) : (
!isLoading && (
<div className="bg-white p-12 rounded-xl shadow-sm text-center">
<h3 className="text-lg font-bold text-slate-800">No PDF Loaded</h3>
<p className="text-sm text-slate-500 max-w-md mx-auto mt-1">
Upload your daily hospital floor stock delivery note PDF to separate items into their respective runs.
</p>
</div>
)
)}
</div>
) : (
<div className="bg-white rounded-xl shadow-sm p-6">
<h2 className="text-xl font-bold text-slate-800 mb-2">CATEGORY RULE SETTINGS</h2>
<p className="text-xs text-slate-500 mb-6">Manage keywords used to automatically route incoming PDF items into the category runs.</p>

<form onSubmit={handleAddItemRule} className="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-8 flex flex-col md:flex-row gap-3 items-end">
<div className="flex-1 w-full">
<label className="block text-xs font-semibold text-slate-600 mb-1">Item Name / Keyword</label>
<input
type="text"
value={newCategoryItem}
onChange={(e) => setNewCategoryItem(e.target.value)}
placeholder="e.g., Strawberry Yoghurt"
className="w-full p-2.5 border rounded-lg text-sm focus:outline-emerald-500"
/>
</div>

<div className="w-full md:w-56">
<label className="block text-xs font-semibold text-slate-600 mb-1">Assign to Category Run</label>
<select
value={targetCategory}
onChange={(e) => setTargetCategory(e.target.value)}
className="w-full p-2.5 border rounded-lg text-sm focus:outline-emerald-500 bg-white"
>
{availableCategories.map(cat => (
<option key={cat} value={cat}>{cat}</option>
))}
</select>
</div>

<button
type="submit"
className="w-full md:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg transition"
>
Add Item Rule
</button>
</form>

<div className="grid md:grid-cols-2 gap-6">
{Object.entries(rules).map(([category, keywords]) => (
<div key={category} className="border border-slate-200 rounded-xl p-4">
<h3 className="font-bold text-slate-800 border-b pb-2 mb-3 flex justify-between items-center">
<span>{category}</span>
<span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600">{keywords.length} keywords</span>
</h3>

<div className="flex flex-wrap gap-1.5">
{keywords.length === 0 ? (
<span className="text-xs text-slate-400 italic">All items not matched in other categories automatically fall here.</span>
