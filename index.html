<html lang="en">
<head>

<!-- Gemini-inspired Z SVG Favicon & Apple Touch Icon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><defs><linearGradient id='gZ' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231A73E8'/><stop offset='35%' stop-color='%238E24AA'/><stop offset='70%' stop-color='%23E91E63'/><stop offset='100%' stop-color='%23FFB300'/></linearGradient><radialGradient id='bG' cx='50%' cy='50%' r='50%'><stop offset='0%' stop-color='%232563EB' stop-opacity='0.4'/><stop offset='60%' stop-color='%231E3A8A' stop-opacity='0.15'/><stop offset='100%' stop-color='%230F172A' stop-opacity='0'/></radialGradient><filter id='gw' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='14' result='b'/><feComposite in='SourceGraphic' in2='b' operator='over'/></filter></defs><rect width='500' height='500' rx='100' fill='%230B1329'/><circle cx='250' cy='250' r='220' fill='url(%23bG)'/><path d='M 140 130 H 360 C 375 130, 385 142, 380 156 L 190 350 H 360 C 375 350, 385 362, 380 376 C 376 385, 368 390, 360 390 H 140 C 125 390, 115 378, 120 364 L 310 170 H 140 C 125 170, 115 158, 120 144 C 124 135, 132 130, 140 130 Z' fill='url(%23gZ)' filter='url(%23gw)'/></svg>">

<body class="bg-slate-100 min-h-screen text-slate-800">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

if (typeof pdfjsLib !== 'undefined') {
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// Gemini Z Logo Component
const GeminiZLogo = () => (
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" className="w-9 h-9 flex-shrink-0">
<defs>
<linearGradient id="hdrGeminiZ" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stopColor="#1A73E8" />
<stop offset="35%" stopColor="#8E24AA" />
<stop offset="70%" stopColor="#E91E63" />
<stop offset="100%" stopColor="#FFB300" />
</linearGradient>
<radialGradient id="hdrBlueGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stopColor="#2563EB" stopOpacity="0.4" />
<stop offset="60%" stopColor="#1E3A8A" stopOpacity="0.15" />
<stop offset="100%" stopColor="#0F172A" stopOpacity="0" />
</radialGradient>
<filter id="hdrGlow" x="-20%" y="-20%" width="140%" height="140%">

<path
d="M 140 130 H 360 C 375 130, 385 142, 380 156 L 190 350 H 360 C 375 350, 385 362, 380 376 C 376 385, 368 390, 360 390 H 140 C 125 390, 115 378, 120 364 L 310 170 H 140 C 125 170, 115 158, 120 144 C 124 135, 132 130, 140 130 Z"
fill="url(#hdrGeminiZ)"
filter="url(#hdrGlow)"

</svg>
);

const DEFAULT_RULES = {
"ED - DAVE": [],
"ZAW REHAB COLD RUN": [
"Brownes", "Full Cream Milk PC", "Hilo Milk PC", "Full Cream Milk - Brownes", "Hilo Milk - Brownes",
"Cheese - Cheddar PC", "Rice Pudding", "Custard PC",
"Vanilla Yogurt PC", "Vanilla Yoghurt PC", "Strawberry Yogurt PC", "Strawberry Yoghurt PC",
"Apple Juice PC", "Orange Juice PC", "Fresh Apple", "Apple Fresh", "Ice Coffee", "Iced Coffee",
"Chocolate Chill", "Ham & Salad Sandwich", "Egg Mayo Sandwich"
],
"STEVE.M REHAB DRY RUN": [],
"BEN JUICE RUN": [
"Apple Juice", "Orange Juice", "Diced Peaches", "Diced Pears"
],
"CHILLER RUN": [
"Full Cream Milk", "Hilo Milk", "Hilo PC Milk", "Brownes",
"Vanilla Yoghurt", "Strawberry Yoghurt", "Strawberry Yogurt",
"Rice Pudding", "Custard", "Cheese - Cheddar", "Cheddar PC",
"Sandwich", "Ham & Salad", "Egg Mayo"
],
"JAMES DRY RUN": [
"White Sugar", "Coffee PC", "Decaf Coffee", "Sweetener",
"Water Crackers", "Scotch Nice", "Soy Milk", "Rice Milk",
"Lactose Free Milk", "Tea Bags Black", "Green Tea", "Tea Bags - Bushells",
"Fruit Cake PC", "Milo"
],
"FREEZER RUN": [
"Ice Cream", "Butter PC", "Margarine PC"
],
"AFTERNOON RUN": [
"Bananas fresh", "Fresh Bananas", "Apple Fresh", "Fresh Apple", "Carrot Cake"
],
"PANTRY RUN": [
"Thick", "Thickened", "Level 100", "Level 400", "Level 900"
],
"MEDI HOTEL - CHILLER": [],
"MEDI HOTEL - DRY": []
};

const REHAB_WARDS = ["fshrehab2", "fshrehab1", "fshrehabground", "fshrehabg", "fshmentalhealtha", "rehab2", "rehab1", "rehabground", "rehabg", "mentalhealtha", "mentalhealth"];
const MEDI_HOTEL_WARDS = ["m8", "m7", "m6", "m5"];

const REHAB_FREEZER_KEYWORDS = [
"butter pc", "margarine pc", "ice cream", "ice-cream", "carrot cake",
"white bread", "wholemeal bread", "multigrain bread", "le moulin",
"apple puree", "diced pears", "diced peaches", "riviana"
];

const AFTERNOON_KEYWORDS = [
"apple fresh", "fresh apple", "bananas fresh", "fresh bananas", "banana", "carrot cake"
];

const BREAD_KEYWORDS = [
"white bread", "wholemeal bread", "multigrain bread", "le moulin", "bread"
];

const JUICE_WARD_ORDER = [
"Mental Health", "Mental Health A", "Rehab 2", "Rehab Ground", "Rehab G", "Rehab 1",
"FSH SSU", "SSU",
"FSH 3AB", "3AB", "FSH 4AB", "4AB", "FSH 5AB", "5AB", "FSH 6AB", "6AB", "FSH 7AB", "7AB",
"FSH 7CD", "7CD", "FSH 6CD", "6CD", "FSH 5CD", "5CD", "FSH 4CD", "4CD", "FSH 3CD", "3CD",
"FSH CCU", "CCU", "FSH ICU", "ICU",
"FSH - M8", "M8", "FSH - M7", "M7", "FSH - M6", "M6", "FSH - M5", "M5"
];

const CHILLER_WARD_ORDER = [
"Mental Health", "Rehab Ground", "Rehab G", "Rehab 2", "Rehab 1",
"FSH 7CD", "7CD", "FSH 6CD", "6CD", "FSH 5CD", "5CD", "FSH 4CD", "4CD", "FSH 3CD", "3CD",
"FSH CCU", "CCU", "FSH ICU", "ICU",
"FSH 7AB", "7AB", "FSH 6AB", "6AB", "FSH 5AB", "5AB", "FSH 4AB", "4AB", "FSH 3AB", "3AB",
"FSH SSU", "SSU",
"FSH - M8", "M8", "FSH - M7", "M7", "FSH - M6", "M6", "FSH - M5", "M5"
];

const ZAW_REHAB_WARD_ORDER = ["Rehab Ground", "FSH-Rehab Ground", "Rehab G", "FSH-Rehab G", "Rehab 2", "FSH-Rehab 2", "Rehab 1", "FSH-Rehab 1", "Mental Health A", "FSH-Mental Health A"];
const STEVE_REHAB_WARD_ORDER = ["Rehab 2", "FSH-Rehab 2", "Rehab Ground", "FSH-Rehab Ground", "Rehab G", "FSH-Rehab G", "Rehab 1", "FSH-Rehab 1", "Mental Health A", "FSH-Mental Health A"];

const STANDARD_RUN_WARD_ORDER = [
"FSH 7CD", "7CD", "FSH 6CD", "6CD", "FSH 5CD", "5CD", "FSH 4CD", "4CD", "FSH 3CD", "3CD",
"FSH CCU", "CCU", "FSH ICU", "ICU",
"FSH 7AB", "7AB", "FSH 6AB", "6AB", "FSH 5AB", "5AB", "FSH 4AB", "4AB", "FSH 3AB", "3AB",
"FSH SSU", "SSU"
];

const formatDateDDMMYY = (dateStr) => {
if (!dateStr) return "";
const parts = dateStr.match(/(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})/);
if (parts) {
let day, month, year;
if (parts[1].length === 4) {
year = parts[1].slice(-2);
month = parts[2].padStart(2, '0');
day = parts[3].padStart(2, '0');
} else {
day = parts[1].padStart(2, '0');
month = parts[2].padStart(2, '0');
year = parts[1].slice(-2);
}
return `${day}/${month}/${year}`;
}
return dateStr;
};

function CategoryLabel({ name, isSelected }) {
if (name === "ZAW REHAB COLD RUN") {
return (
<span>
ZAW <span className={isSelected ? "bg-amber-300 text-slate-900 px-1 rounded font-extrabold" : "bg-yellow-300 text-slate-900 px-1 rounded font-bold"}>REHAB COLD RUN</span>
</span>
);
}
if (name === "STEVE.M REHAB DRY RUN") {
return (
<span>
STEVE.M <span className={isSelected ? "bg-amber-300 text-slate-900 px-1 rounded font-extrabold" : "bg-yellow-300 text-slate-900 px-1 rounded font-bold"}>REHAB DRY RUN</span>
</span>
);
}
if (name === "BEN JUICE RUN") {
return (
<span>
BEN <span className={isSelected ? "bg-amber-300 text-slate-900 px-1 rounded font-extrabold" : "bg-yellow-300 text-slate-900 px-1 rounded font-bold"}>JUICE RUN</span>
</span>
);
}
if (name === "JAMES DRY RUN") {
return (
<span>
JAMES <span className={isSelected ? "bg-amber-300 text-slate-900 px-1 rounded font-extrabold" : "bg-yellow-300 text-slate-900 px-1 rounded font-bold"}>DRY RUN</span>
</span>
);
}
return <span>{name}</span>;
}

function App() {
const [rules, setRules] = useState(() => {
try {
const saved = localStorage.getItem('zstores_rules_v24');
return saved ? JSON.parse(saved) : DEFAULT_RULES;
} catch(e) {
return DEFAULT_RULES;
}
});

const [parsedData, setParsedData] = useState([]);
const [deliveryDate, setDeliveryDate] = useState("");
const [selectedRun, setSelectedRun] = useState("ED - DAVE");
const [checkedItems, setCheckedItems] = useState({});
const [highlightedItemKey, setHighlightedItemKey] = useState(null);
const [activeTab, setActiveTab] = useState("picker");
const [newCategoryItem, setNewCategoryItem] = useState("");
const [targetCategory, setTargetCategory] = useState("ED - DAVE");
const [isLoading, setIsLoading] = useState(false);

useEffect(() => {
try {
localStorage.setItem('zstores_rules_v24', JSON.stringify(rules));
} catch(e) {}
}, [rules]);

useEffect(() => {
setHighlightedItemKey(null);
}, [selectedRun]);

const getItemType = (itemName) => {
const lower = itemName.toLowerCase();

if (lower.includes("ice cream") || lower.includes("ice-cream") || lower.includes("bulla")) {
return "FREEZER";
}

if (
lower.includes("soy milk") ||
lower.includes("lactose free") ||
lower.includes("rice milk") ||
lower.includes("vitasoy") ||
lower.includes("so good") ||
lower.includes("little things") ||
lower.includes("sugar") ||
lower.includes("tea") ||
lower.includes("coffee") ||
lower.includes("cracker") ||
lower.includes("biscuit")
) {
return "DRY";
}

const chillerKeywords = [...(rules["CHILLER RUN"] || []), "brownes", "milk", "yoghurt", "yogurt", "custard", "pudding", "juice", "butter", "margarine", "cheese", "sandwich", "ice coffee", "iced coffee", "chill"];
if (chillerKeywords.some(kw => lower.includes(kw.toLowerCase()))) {
return "CHILLER";
}

return "DRY";
};

const getCategory = (itemName, wardName) => {
const lowerItem = itemName.toLowerCase();
const cleanWard = wardName.toLowerCase().replace(/[^a-z0-9]/g, '');

if (cleanWard.includes("emergency") || cleanWard.includes("ed")) {
return "ED - DAVE";
}

if (MEDI_HOTEL_WARDS.some(mw => cleanWard.includes(mw))) {
const itemType = getItemType(itemName);
return itemType === "CHILLER" ? "MEDI HOTEL - CHILLER" : "MEDI HOTEL - DRY";
}

const isRehabWard = REHAB_WARDS.some(rw => cleanWard.includes(rw));
if (isRehabWard) {
const isFreezerItem = REHAB_FREEZER_KEYWORDS.some(kw => lowerItem.includes(kw));
if (isFreezerItem) {
return "FREEZER RUN";
}

const zawKeywords = rules["ZAW REHAB COLD RUN"] || DEFAULT_RULES["ZAW REHAB COLD RUN"];
const isZawItem = zawKeywords.some(kw => lowerItem.includes(kw.toLowerCase()));
return isZawItem ? "ZAW REHAB COLD RUN" : "STEVE.M REHAB DRY RUN";
}

const isBreadItem = BREAD_KEYWORDS.some(kw => lowerItem.includes(kw));
if (isBreadItem) {
return null;
}

if (lowerItem.includes("sandwich") || lowerItem.includes("ham & salad") || lowerItem.includes("egg mayo")) {
return "CHILLER RUN";
}

const isAfternoonItem = AFTERNOON_KEYWORDS.some(kw => lowerItem.includes(kw));
if (isAfternoonItem) {
return "AFTERNOON RUN";
}

if (lowerItem.includes("thick") || lowerItem.includes("level")) {
return "PANTRY RUN";
}

for (const [category, keywords] of Object.entries(rules)) {
if (["ED - DAVE", "ZAW REHAB COLD RUN", "STEVE.M REHAB DRY RUN", "MEDI HOTEL - CHILLER", "MEDI HOTEL - DRY"].includes(category)) continue;
if (keywords.some(kw => lowerItem.includes(kw.toLowerCase()))) {
return category;
}
}

return "PANTRY RUN";
};

const handleFileUpload = async (event) => {
const file = event.target.files[0];
if (!file) return;

setIsLoading(true);
try {
const arrayBuffer = await file.arrayBuffer();
const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
let fullTextLines = [];

for (let i = 1; i <= pdf.numPages; i++) {
const page = await pdf.getPage(i);
const textContent = await page.getTextContent();
const pageLines = textContent.items.map(item => item.str.trim()).filter(str => str !== "");
fullTextLines = [...fullTextLines, ...pageLines];
}

const { orders, extractedDate } = parseDeliveryNoteLines(fullTextLines);
setParsedData(orders);
setDeliveryDate(extractedDate);
setCheckedItems({});
setHighlightedItemKey(null);
} catch (err) {
alert("Error parsing PDF file: " + err.message);
} finally {
setIsLoading(false);
}
};

const parseDeliveryNoteLines = (lines) => {
const orders = [];
let currentWard = "Unknown Ward";
let extractedDate = "";

for (let i = 0; i < lines.length; i++) {
const line = lines[i];

if (line.toLowerCase().includes("for date:") || line.toLowerCase().includes("delivery note")) {
const dateMatch = line.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/);
if (dateMatch && !extractedDate) {
extractedDate = formatDateDDMMYY(dateMatch[0]);
}
}

if (line.includes("FSH-") || line.toLowerCase().includes("rehab") || line.toLowerCase().includes("mental health") || line.toLowerCase().includes("emergency")) {
if (!extractedDate) {
const dateMatch = line.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/);
if (dateMatch) extractedDate = formatDateDDMMYY(dateMatch[0]);
}

const match = line.match(/(FSH-[A-Za-z0-9\s\/]+?|Mental Health[A-Za-z0-9\s]*|Rehab\s+[A-Za-z0-9]+|Emergency)(?=\s+Ad|\s+\/|$)/i);
if (match) {
currentWard = match[1].trim();
} else {
currentWard = line.trim();
}
continue;
}

if (line.match(/^\d+$/) && i + 3 < lines.length) {
const possibleQty = lines[i + 1];
const possibleUnit = lines[i + 2];
const possibleName = lines[i + 3];

if (possibleQty.match(/^\d+$/) && (possibleUnit === "Each" || possibleUnit === "Litre" || possibleUnit === "Kilogram")) {
const assignedCategory = getCategory(possibleName, currentWard);

if (assignedCategory !== null) {
orders.push({
id: `${currentWard}-${possibleName}-${Math.random()}`,
ward: currentWard,
qty: parseInt(possibleQty, 10),
unit: possibleUnit,
name: possibleName,
category: assignedCategory
});
}
i += 3;
}
}
}

return { orders, extractedDate };
};

const toggleCheck = (id) => {
setCheckedItems(prev => ({ ...prev, [id]: !prev[id] }));
};

const toggleSummaryHighlight = (itemKey) => {
setHighlightedItemKey(prev => (prev === itemKey ? null : itemKey));
};

const currentRunItems = useMemo(() => {
return parsedData.filter(item => item.category === selectedRun);
}, [parsedData, selectedRun]);

const itemSummary = useMemo(() => {
const totals = {};
currentRunItems.forEach(item => {
const key = `${item.name} (${item.unit})`;
totals[key] = (totals[key] || 0) + item.qty;
});
return totals;
}, [currentRunItems]);

const sortWardsByOrder = (grouped, orderArray) => {
const sortedGrouped = {};

orderArray.forEach(targetWard => {
const foundKey = Object.keys(grouped).find(
w => w.toLowerCase().replace(/[^a-z0-9]/g, '') === targetWard.toLowerCase().replace(/[^a-z0-9]/g, '')
);
if (foundKey && !sortedGrouped[foundKey]) {
sortedGrouped[foundKey] = grouped[foundKey];
}
});

Object.keys(grouped).forEach(wardKey => {
if (!sortedGrouped[wardKey]) {
sortedGrouped[wardKey] = grouped[wardKey];
}
});

return sortedGrouped;
};

const itemsByWard = useMemo(() => {
const grouped = {};
currentRunItems.forEach(item => {
if (!grouped[item.ward]) grouped[item.ward] = [];
grouped[item.ward].push(item);
});

if (selectedRun === "ED - DAVE") {
const typePriority = { "FREEZER": 0, "CHILLER": 1, "DRY": 2 };
Object.keys(grouped).forEach(wardKey => {
grouped[wardKey].sort((a, b) => {
const typeA = getItemType(a.name);
const typeB = getItemType(b.name);
return typePriority[typeA] - typePriority[typeB];
});
});
}

if (selectedRun === "CHILLER RUN") {
return sortWardsByOrder(grouped, CHILLER_WARD_ORDER);
} else if (selectedRun === "BEN JUICE RUN") {
return sortWardsByOrder(grouped, JUICE_WARD_ORDER);
} else if (selectedRun === "ZAW REHAB COLD RUN") {
return sortWardsByOrder(grouped, ZAW_REHAB_WARD_ORDER);
} else if (selectedRun === "STEVE.M REHAB DRY RUN") {
return sortWardsByOrder(grouped, STEVE_REHAB_WARD_ORDER);
} else if (["JAMES DRY RUN", "FREEZER RUN", "AFTERNOON RUN", "PANTRY RUN"].includes(selectedRun)) {
return sortWardsByOrder(grouped, STANDARD_RUN_WARD_ORDER);
}

return grouped;
}, [currentRunItems, selectedRun]);

const handleAddItemRule = (e) => {
e.preventDefault();
if (!newCategoryItem.trim()) return;

setRules(prev => ({
...prev,
[targetCategory]: [...(prev[targetCategory] || []), newCategoryItem.trim()]
}));
setNewCategoryItem("");
};

const handleRemoveRule = (category, keyword) => {
setRules(prev => ({
...prev,
[category]: prev[category].filter(k => k !== keyword)
}));
};

const availableCategories = [
"ED - DAVE", "ZAW REHAB COLD RUN", "STEVE.M REHAB DRY RUN", "BEN JUICE RUN",
"CHILLER RUN", "JAMES DRY RUN", "FREEZER RUN", "AFTERNOON RUN",
"PANTRY RUN", "MEDI HOTEL - CHILLER", "MEDI HOTEL - DRY"
];

return (
<div className="max-w-6xl mx-auto p-4 md:p-6">
<header className="no-print bg-slate-900 text-white p-4 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
<div className="flex items-center gap-3">
<GeminiZLogo />
<div>
<h1 className="text-2xl font-bold tracking-wide bg-gradient-to-r from-blue-400 via-purple-400 to-amber-400 bg-clip-text text-transparent">
Zstores
</h1>
<p className="text-slate-400 text-xs">Hospital Store Category Run Dispatch System</p>
</div>
</div>

<div className="flex items-center gap-3">
<button
onClick={() => setActiveTab("picker")}
className={`px-4 py-2 text-sm font-semibold rounded-lg transition ${activeTab === 'picker' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
>
RUN PICKER
</button>
<button
onClick={() => setActiveTab("settings")}
className={`px-4 py-2 text-sm font-semibold rounded-lg transition ${activeTab === 'settings' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
>
ITEM RULES SETTINGS
</button>
</div>
</header>

{activeTab === "picker" ? (
<div>
<div className="no-print bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
<div className="w-full md:w-auto">
<label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Upload Daily Delivery Note PDF</label>
<input
type="file"
accept="application/pdf"
onChange={handleFileUpload}
className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer"
/>
</div>

{parsedData.length > 0 && (
<button
onClick={() => window.print()}
className="w-full md:w-auto px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium rounded-lg flex items-center justify-center gap-2 shadow"
>
<span>PRINT ACTIVE RUN LIST</span>
</button>
)}
</div>

{isLoading && (
<div className="bg-white p-8 rounded-xl shadow-sm text-center font-medium text-slate-600">
Processing PDF Delivery Note...
</div>
)}

{parsedData.length > 0 && (
<div className="no-print grid grid-cols-2 md:grid-cols-4 gap-2 mb-6">
{availableCategories.map(category => {
const count = parsedData.filter(i => i.category === category).length;
const isSelected = selectedRun === category;
return (
<button
key={category}
onClick={() => setSelectedRun(category)}
className={`p-3 rounded-xl border text-left transition relative ${
isSelected
? 'bg-emerald-600 text-white border-emerald-600 shadow-md'
: 'bg-white text-slate-700 border-slate-200 hover:border-slate-300'
}`}
>
<div className="text-xs font-bold tracking-wider opacity-90">
<CategoryLabel name={category} isSelected={isSelected} />
</div>
<div className="text-xl font-bold mt-1">{count} <span className="text-xs font-normal">items</span></div>
</button>
);
})}
</div>
)}

{parsedData.length > 0 ? (
<div>
<div className="mb-4 flex justify-between items-end border-b pb-3">
<div>
<h2 className="text-xl font-bold text-slate-800">
<CategoryLabel name={selectedRun} isSelected={false} /> DELIVERY LIST
</h2>
<p className="text-xs text-slate-500">
{selectedRun === "ED - DAVE"
? "Sorted: Freezer (Top) ➔ Chiller (Middle) ➔ Dry (Bottom)"
: "Sorted in fixed route print sequence"}
</p>
</div>
<div className="flex items-center gap-2">
{deliveryDate && (
<span className="text-xs font-bold bg-emerald-100 text-emerald-900 border border-emerald-200 px-3 py-1 rounded-full">
Date: {deliveryDate}
</span>
)}
<span className="text-xs font-medium bg-slate-200 text-slate-700 px-3 py-1 rounded-full">
{currentRunItems.length} Total Items
</span>
</div>
</div>

{/* CATERING STORE PICKING SUMMARY */}
{Object.keys(itemSummary).length > 0 && (
<div className="card bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
<div className="flex justify-between items-center mb-2 border-b border-emerald-200 pb-1">
<h3 className="text-sm font-bold text-emerald-900 uppercase tracking-wider">
📦 CATERING STORE PICK LIST SUMMARY
</h3>
<span className="text-[11px] text-emerald-700 font-medium">
Click an item below to highlight matching lines in yellow
</span>
</div>
<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
{Object.entries(itemSummary).map(([itemLabel, totalQty]) => {
const isSelected = highlightedItemKey === itemLabel;
return (
<button
key={itemLabel}
onClick={() => toggleSummaryHighlight(itemLabel)}
className={`flex justify-between items-center px-3 py-1.5 rounded border text-xs font-semibold transition text-left ${
isSelected
? 'bg-amber-300 text-slate-900 border-amber-500 ring-2 ring-amber-400 font-bold shadow-sm'
: 'bg-white hover:bg-emerald-100 text-slate-800 border-emerald-200'
}`}
>
<span>{itemLabel}</span>
<span className={`${isSelected ? 'bg-slate-900 text-white' : 'bg-emerald-600 text-white'} px-2 py-0.5 rounded font-bold ml-2`}>
{totalQty}
</span>
</button>
);
})}
</div>
</div>
)}

{Object.keys(itemsByWard).length === 0 ? (
<div className="bg-white p-8 rounded-xl shadow-sm text-center text-slate-500">
No items requested for <CategoryLabel name={selectedRun} isSelected={false} /> in today's delivery note.
</div>
) : (
<div className="grid gap-4">
{Object.entries(itemsByWard).map(([ward, items]) => (
<div key={ward} className="card bg-white rounded-xl shadow-sm p-4 border border-slate-200">
<h3 className="text-lg font-bold text-slate-900 border-b pb-2 mb-3 flex justify-between items-center">
<span>{ward}</span>
<span className="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full">
{items.length} items
</span>
</h3>

<div className="divide-y divide-slate-100">
{items.map(item => {
const isChecked = !!checkedItems[item.id];
const itemType = getItemType(item.name);
const itemKey = `${item.name} (${item.unit})`;
const isHighlighted = highlightedItemKey === itemKey;

const badgeStyles = {
"FREEZER": "bg-cyan-100 text-cyan-900 border border-cyan-200",
"CHILLER": "bg-blue-100 text-blue-900 border border-blue-200",
"DRY": "bg-amber-100 text-amber-900 border border-amber-200"
};

return (
<div
key={item.id}
onClick={() => toggleCheck(item.id)}
className={`py-2.5 px-2 flex items-center justify-between cursor-pointer rounded transition ${
isChecked
? 'bg-slate-50 opacity-60'
: isHighlighted
? 'bg-amber-100 text-amber-950 font-bold border-l-4 border-amber-500 shadow-sm'
: 'hover:bg-slate-50'
}`}
>
<div className="flex items-center gap-3">
<input
type="checkbox"
checked={isChecked}
onChange={() => {}}
className="w-5 h-5 accent-emerald-600 rounded cursor-pointer"
/>
<span className={`text-sm ${isChecked ? 'line-through text-slate-400 font-normal' : isHighlighted ? 'text-amber-950 font-bold text-base' : 'text-slate-800 font-medium'}`}>
{item.name}
</span>
{selectedRun === "ED - DAVE" && (
<span className={`text-[10px] font-bold px-2 py-0.5 rounded ${badgeStyles[itemType]}`}>
{itemType}
</span>
)}
</div>

<div className={`text-sm font-bold px-3 py-1 rounded-md ${isHighlighted ? 'bg-amber-300 text-slate-900 border border-amber-400' : 'bg-slate-100 text-slate-900'}`}>
{item.qty} <span className="text-xs font-normal text-slate-600">{item.unit}</span>
</div>
</div>
);
})}
</div>
</div>
))}
</div>
)}
</div>
) : (
!isLoading && (
<div className="bg-white p-12 rounded-xl shadow-sm text-center">
<h3 className="text-lg font-bold text-slate-800">No PDF Loaded</h3>
<p className="text-sm text-slate-500 max-w-md mx-auto mt-1">
Upload your daily hospital floor stock delivery note PDF to separate items into their respective runs.
</p>
</div>
)
)}
</div>
) : (
<div className="bg-white rounded-xl shadow-sm p-6">
<h2 className="text-xl font-bold text-slate-800 mb-2">CATEGORY RULE SETTINGS</h2>
<p className="text-xs text-slate-500 mb-6">Manage keywords used to automatically route incoming PDF items into the category runs.</p>

<form onSubmit={handleAddItemRule} className="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-8 flex flex-col md:flex-row gap-3 items-end">
<div className="flex-1 w-full">
<label className="block text-xs font-semibold text-slate-600 mb-1">Item Name / Keyword</label>
<input
type="text"
value={newCategoryItem}
onChange={(e) => setNewCategoryItem(e.target.value)}
placeholder="e.g., Strawberry Yoghurt"
className="w-full p-2.5 border rounded-lg text-sm focus:outline-emerald-500"
/>
</div>

<div className="w-full md:w-56">
<label className="block text-xs font-semibold text-slate-600 mb-1">Assign to Category Run</label>
<select
value={targetCategory}
onChange={(e) => setTargetCategory(e.target.value)}
className="w-full p-2.5 border rounded-lg text-sm focus:outline-emerald-500 bg-white"
>
{availableCategories.map(cat => (
<option key={cat} value={cat}>{cat}</option>
))}
</select>
</div>

<button
type="submit"
className="w-full md:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg transition"
>
Add Item Rule
</button>
</form>

<div className="grid md:grid-cols-2 gap-6">
{Object.entries(rules).map(([category, keywords]) => (
<div key={category} className="border border-slate-200 rounded-xl p-4">
<h3 className="font-bold text-slate-800 border-b pb-2 mb-3 flex justify-between items-center">
<CategoryLabel name={category} isSelected={false} />
<span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600">{keywords.length} keywords</span>
</h3>

<div className="flex flex-wrap gap-1.5">
{keywords.length === 0 ? (
<span className="text-xs text-slate-400 italic">All items matching this ward route here automatically.</span>
) : (
keywords.map((kw, idx) => (
<span key={idx} className="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md flex items-center gap-2 border border-slate-200">
{kw}
<button
onClick={() => handleRemoveRule(category, kw)}
className="text-slate-400 hover:text-red-500 font-bold"
>
x
</button>
</span>
))
)}
</div>
</div>
))}
</div>
</div>
)}
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
