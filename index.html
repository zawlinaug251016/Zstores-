                      <CategoryLabel name={e}isSelected={!1}/>
                      <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600 flex-shrink-0">
                        {t?"ward-based":`${a.length} keywords`}
                      </span>
                    </h3>

                    {t?<p className="text-xs text-slate-400 italic">{WARD_ONLY_CATEGORIES[e]}</p>:<div className="flex flex-wrap gap-1.5">
                        {a.length===0?<span className="text-xs text-slate-400 italic">No keywords yet — nothing routes here automatically until you add one.</span>:a.map((s,r)=><span key={r}className="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md flex items-center gap-2 border border-slate-200">
                              {s}
                              <button onClick={()=>me(e,s)}aria-label={`Remove ${s}`}className="text-slate-400 hover:text-red-500 font-bold focus:outline-none focus-visible:ring-2 focus-visible:ring-red-300 rounded">
                                ×
                              </button>
                            </span>)}
                      </div>}
                  </div>})}
              </div>
            </div>}

          {}
          {i.length>0&&R==="picker"&&<div className="no-print md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-3 flex items-center justify-between gap-3 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
              <div className="text-xs font-semibold text-slate-600 tabular-nums">
                {F}/{f.length} picked
              </div>
              <button onClick={()=>window.print()}className="px-4 py-2 bg-slate-800 text-white text-sm font-medium rounded-lg">
                Print run
              </button>
            </div>}
        </div>}const root=ReactDOM.createRoot(document.getElementById("root"));root.render(<App/>);
</script>
</body></html>
